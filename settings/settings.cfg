; DIVEPUNK runtime settings — INI-style (Godot ConfigFile format).
; Loaded at startup by autoload/config.gd. Edit, save, re-run — no code changes.
;
; NOTE: gameplay "feel" (ship speed/steering, camera FOV/shake) lives on the Ship
; and CameraRig nodes as @export values — tune those live in the Inspector. This
; file is for window / display / world-level knobs that aren't node-specific.

[display]

; Window size in pixels (applied at boot).
width=3840
height=2160

; window_mode: "windowed" | "maximized" | "fullscreen" | "exclusive_fullscreen"
window_mode="fullscreen"

; Vertical sync on/off.
vsync=true

; Frame cap (FPS). 0 = uncapped; any value is a hard ceiling. Match your monitor's refresh.
max_fps=160

[game]

; World seed for the procedural city.
;   0          -> a new random city every run (the seed is printed to the console)
;   any number -> a fixed, reproducible city (great for comparing runs / bug repro)
seed=0

; World scale: enlarges the city (buildings) around the constant-size car.
;   1.0 = original size; 2.0 = double-size buildings (with matching spacing).
; The car, the flyable corridor, and flight feel are unchanged — only the city grows.
scale=10.0

[corridor]

; The clear flyable tube the ship moves through (buildings sit just outside it).
; All values are absolute metres. NOTE: building height scales with [game] scale, so if you
; change scale, raise/lower `ceiling` to keep it just above the rooftops
; (rough rule of thumb: ceiling ~= 170 * scale — that's a touch over the tallest tower).

; Horizontal half-width (centre to each side wall).
half_width=120.0

; Vertical ceiling — set slightly ABOVE the city's tallest roofs so you can crest them.
; (At scale 10 the tallest tower is ~1612 m, so 1700 leaves a little headroom.)
ceiling=1700.0

; Vertical floor (just above the ground plane).
floor=4.0

[ship]

; Forward-speed model (m/s). A run starts at base_speed and ramps toward max_speed; boost
; multiplies the current speed for a surge. A bigger base->boosted gap = more speed variation.
base_speed=20.0
max_speed=2000.0
boost_multiplier=10.0

; Boost ease rates (per second; higher = snappier). The OUT rate is deliberately slower than
; the IN rate, so releasing boost bleeds speed off gradually instead of dropping it sharply.
boost_in_rate=5.0
boost_out_rate=1.0

; Vertical (climb/dive) speed scales with forward speed: climb speed = the LARGER of
; `vertical_speed` (a floor for low-speed control) and forward_speed × vertical_speed_fraction.
; fraction 0.5 ≈ a 27° climb at speed; set the floor to 0 for purely proportional vertical.
vertical_speed=35.0
vertical_speed_fraction=0.5

; Visual tilt direction. true = the model noses UP as you climb and banks into strafes
; (the natural arcade feel); false = the inverted / original tilt.
invert_pitch=true
invert_bank=true

[camera]

; Three chase-camera distances as boom multipliers; press Q in-game to cycle close→normal→far.
; 1.0 = the previous fixed distance, which sits midway between `close` and `normal`.
distance_close=0.7
distance_normal=1.3
distance_far=2.2

; Which level a run starts on: 0=close, 1=normal, 2=far.
default_level=1

[traffic]

; Moving cars cruising the corridor in both directions — a live hazard, distinct magenta.
count=24
min_speed=30.0
max_speed=140.0

; Fraction of cars heading TOWARD you (+Z); the rest cruise the way you fly.
toward_fraction=0.5

[debug]

; Print chunk spawn/recycle events to the console (handy while tuning streaming).
log_streaming=false

[fx]

; ── Aesthetic pass (M4). Most of these are desktop niceties — turn them off if you need FPS. ──

; Neon bloom around bright emissive surfaces.
glow=true
glow_intensity=0.85
bloom=0.12

; Tonemap exposure (overall scene brightness into the tonemapper). 1.0 = neutral.
exposure=1.0

; Extra colour saturation/contrast pushed in post (makes the neon sing). 1.0 = off.
saturation=1.22

; Exponential distance fog density (depth cue + hides the streaming draw distance).
fog_density=0.01

; Volumetric fog — the moody haze layer (heavier; desktop). Disable for a clearer/faster view.
volumetric_fog=true
volumetric_fog_density=0.018

; Screen-space reflections — wet-street neon reflections (Forward+ desktop only).
ssr=true

; Animated neon "windows" on the buildings (procedural shader). false = flat emissive boxes.
building_windows=true

; Pulsing emissive glow on the hazards (obstacles + traffic) so they telegraph at speed.
hazard_pulse=true

; Fullscreen speed-line streaks that intensify with speed (the "feels fast" layer).
speed_lines=true
speed_lines_strength=1.0

; Chromatic aberration + vignette that ramp with speed / boost (desktop).
chromatic_aberration=true

; White flash + a brief slow-mo on a near-miss (juice). time_dilation 1.0 = no slow-mo,
; lower = stronger dip (e.g. 0.9 briefly slows time to 90%).
near_miss_flash=true
time_dilation=0.9

[audio]

; Master / music / SFX levels, linear 0..1 (0 = silent, 1 = full). Every sound is synthesised
; procedurally in code for now (placeholder tones until real audio assets are added).
master=0.9
music=0.5
sfx=0.8

; Background synth music bed on/off.
music_enabled=true
