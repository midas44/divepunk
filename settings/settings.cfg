; DIVEPUNK runtime settings — INI-style (Godot ConfigFile format).
; Loaded at startup by autoload/config.gd. Edit, save, re-run — no code changes.
;
; NOTE: gameplay "feel" (ship speed/steering, camera FOV/shake) lives on the Ship
; and CameraRig nodes as @export values — tune those live in the Inspector. This
; file is for window / display / world-level knobs that aren't node-specific.

[display]

; Window size in pixels (applied at boot).
width=2560
height=1440

; window_mode: "windowed" | "maximized" | "fullscreen" | "exclusive_fullscreen"
window_mode="fullscreen"

; Vertical sync on/off.
vsync=true

; Frame cap. 0 = uncapped (vsync still limits it when enabled).
max_fps=0

[game]

; World seed for the procedural city.
;   0          -> a new random city every run (the seed is printed to the console)
;   any number -> a fixed, reproducible city (great for comparing runs / bug repro)
seed=0

[debug]

; Print chunk spawn/recycle events to the console (handy while tuning streaming).
log_streaming=false
