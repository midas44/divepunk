; DIVEPUNK runtime settings — INI-style (Godot ConfigFile format).
; Loaded at startup by autoload/config.gd. Edit, save, re-run — no code changes.
;
; NOTE: gameplay "feel" (ship speed/steering, camera FOV/shake) lives on the Ship
; and CameraRig nodes as @export values — tune those live in the Inspector. This
; file is for window / display / world-level knobs that aren't node-specific.

[display]

; Window size in pixels (applied at boot).
width=3840
height=2160

; window_mode: "windowed" | "maximized" | "fullscreen" | "exclusive_fullscreen"
window_mode="fullscreen"

; Vertical sync on/off.
vsync=true

; Frame cap (FPS). 0 = uncapped; any value is a hard ceiling. Match your monitor's refresh.
max_fps=160

[game]

; World seed for the procedural city.
;   0          -> a new random city every run (the seed is printed to the console)
;   any number -> a fixed, reproducible city (great for comparing runs / bug repro)
seed=3

; World scale: enlarges the city (buildings) around the constant-size car.
;   1.0 = original size; 2.0 = double-size buildings (with matching spacing).
; The car, the flyable corridor, and flight feel are unchanged — only the city grows.
scale=4.0

[world]

; The baked open-world (spec §7.1). These drive the OFFLINE bake (./run.sh bake -> res://world/world_8km.res),
; not per-frame gameplay. Change them, re-bake, and the new world ships in the .res. The same seed always
; bakes a byte-identical file.
;   seed   -> the world's fixed layout seed (any int; the committed world_8km.res is baked from this value).
;   extent -> world width in metres on X and Z (the world is centred on the origin). ~8000 = 8x8 km.
seed=1337
extent=8000.0

[flight]

; Assisted-arcade 6-DOF RigidBody flying car (spec §7.4). All forces/torques; tune live, then save+rerun.
; Top speed (LinearVelocity clamp, m/s). Reduced 2026-06-02 5x (1000 -> 200): 1000 m/s (3600 km/h) was
; unflyable for comfortable testing AND so fast the car tunnelled through thin colliders. Raise to taste.
max_speed=200.0

; Thrust along the nose. thrust_force = accelerate; brake_force = decelerate/reverse (N). Heavier mass
; needs more force for the same punch. Reduced 2026-06-02 ~11x (accel was 1000 m/s^2 on mass 4 -> snapped to
; max in ~1s; now ~88 m/s^2 so the car eases up to speed over a few seconds). brake scaled to match thrust.
thrust_force=350.0
brake_force=500.0
mass=4.0

; Rotation authority (torque). Higher = snappier pitch/yaw/roll.
; Reduced 2026-06-02 to ~1/30 of the original 1400/900/1600 — those over-rotated the low-inertia body badly
; (a single key-tap whipped it around). With grip below steering the velocity, these just set rotation SPEED.
; Tune live: raise for snappier, lower if still too twitchy.
pitch_torque=45.0
yaw_torque=30.0
roll_torque=50.0

; Assist. level_strength/level_damping are the PD gains that self-right pitch+roll to the horizon when
; you release the stick (heading is kept). bank_coordination makes yaw auto-bank into the turn.
level_strength=9.0
level_damping=4.5
; bank_coordination 0.7 -> 0.0 (2026-06-02): A/D now steers FLAT (pure yaw, auto-levelled) like a car,
; instead of banking/rolling into the turn (which read as "doing something else"). Raise toward ~0.15 for
; a subtle lean back into turns. (Roll proper is still on Q/E.)
bank_coordination=0.0

; Damping. linear_damp = how fast you coast to a stop; angular_damp = how fast spins settle (assist feel).
; linear_damp 0.6 -> 0.2 (2026-06-02): less drag so the car keeps momentum / glides when you ease off the
; throttle, instead of dropping speed the instant you release it. Raise for more drag (a shorter coast).
linear_damp=0.2
angular_damp=4.0

; Arcade steering assist (added 2026-06-02): how strongly your VELOCITY follows the nose, so rotating the car
; actually steers it (without this the body keeps Newtonian momentum and turning doesn't change travel
; direction). ~1/s. 0 = pure Newtonian (no steering from rotation); higher = velocity snaps to the nose faster.
grip=3.0

; Collision bounce on the car's physics material (0 = no bounce, 1 = super-ball).
bounce=0.3

; Control-direction taste (carried from old [ship] invert_pitch / invert_bank).
invert_pitch=true
invert_roll=true

[damage]

; Collision damage from contact impulse. Health at zero does NOTHING — no game-over (spec §5/§7.5).
; A hit below min_impulse_threshold is ignored (resting/grazing). damage = (impulse − threshold) × impulse_to_damage.
max_health=100.0
impulse_to_damage=0.02
min_impulse_threshold=60.0

; Passive condition regen (per second); 0 = off. A little helps you keep testing without restarting.
repair_rate=3.0

[camera]

; Three chase-camera distances as boom multipliers; press Tab in-game to cycle close→normal→far.
; 1.0 = the previous fixed distance, which sits midway between `close` and `normal`.
distance_close=1.0
distance_normal=2.0
distance_far=3.0

; Which level a run starts on: 0=close, 1=normal, 2=far.
default_level=1

; Vertical field of view (degrees): base = cruising, max = at top speed (the speed→FOV widen that
; "feels fast"). Bigger = wider peripheral view. Sane ranges: base ~70–85, max ~95–115.
base_fov=78.0
max_fov=100.0

; Camera clip planes (metres). `far` is the HARD draw distance — nothing renders past it. It now
; AUTO-extends at startup to cover the streamed city ([streaming] chunks × chunk_length + margin),
; so you normally never touch it — raise it only to push the clip even FURTHER than the city (the
; larger of this value and the auto-computed one wins). near stays tiny so close passes don't clip.
near=0.1
far=10000.0

[traffic]

; Ambient flying traffic — a fixed population of collidable cars roaming the bounded world (no AI).
; count<=0 disables traffic. Keep max_speed well under [flight] max_speed (200) so hits land.
count=24
min_speed=25.0
max_speed=80.0

; Cars start within spawn_radius (m) of the world centre, at a random altitude in [altitude_min, altitude_max] (m).
spawn_radius=1500.0
altitude_min=60.0
altitude_max=400.0

; Deterministic layout seed (any int) — identical population every launch.
seed=1337

[debug]

; Print chunk spawn/recycle events to the console (handy while tuning streaming).
log_streaming=false

[fx]

; ── Aesthetic pass (M4). Most of these are desktop niceties — turn them off if you need FPS. ──

; Neon bloom around bright emissive surfaces.
glow=true
glow_intensity=0.1
bloom=0.1

; Tonemap exposure (overall scene brightness into the tonemapper). 1.0 = neutral.
exposure=1.0

; Extra colour saturation/contrast pushed in post (makes the neon sing). 1.0 = off.
saturation=1.2

; Exponential distance fog density — THE "how far can I see" knob (pairs with [streaming] chunks).
; Opacity grows with distance, so LOWER = see more km. 0.00012 keeps the near/mid city crisp and
; lets the towers read out to ~20 km before fading. Raise toward 0.0005–0.001 for a murkier, closer
; cyberpunk haze; drop toward 0.00006 to see almost to the geometry edge.
fog_density=0.00022

; Volumetric fog — the moody haze layer (heavier; desktop). Disable for a clearer/faster view.
; Kept subtle now that the view is long; volumetric_fog_length caps how far the froxel haze reaches (m).
volumetric_fog=false
volumetric_fog_density=0.0005
volumetric_fog_length=10000.0
; How much the volumetric haze tints the SKY. Godot defaults this to 1.0, which paints the dark haze
; over the whole sky dome and made it render as pure blackness. Keep ~0 so the sky stays visible;
; raise only if you want the haze to swallow the horizon.
volumetric_fog_sky_affect=1.0

; Procedural cloud sky (custom shader): drifting neon-lit clouds + a glowing horizon band, so there's
; visible landscape above the rooftops. false = plain dark sky + horizon band (no clouds, cheaper).
; If the sky shader fails to compile on your GPU (renders flat/magenta), set sky_clouds=false.
sky_clouds=true
; sky_energy is the master sky BRIGHTNESS. Raise if the sky reads too dark, lower if it competes with
; the neon city. ~1.8 makes the deep-blue zenith + neon horizon clearly visible above the rooftops.
sky_energy=0.75
cloud_coverage=0.5
cloud_speed=0.25
; How much the distance fog tints the SKY (0 = sky untouched, 1 = sky fully fogged). Low so the fog
; doesn't flatten the horizon glow/clouds into darkness; a little blends far building tops in.
fog_sky_affect=0.2

; Screen-space reflections — wet-street neon reflections (Forward+ desktop only).
ssr=true

; Dusk ocean plane at sea level (Y=0), shaders/water.gdshader (Task 5). water=false drops the plane
; (you then see the bare seabed terrain). ripple_speed = surface animation rate; energy = overall
; brightness. Visual-only — you fly through it. Task 6 retunes the colours for synthwave dusk.
water=true
water_ripple_speed=0.04
water_energy=1.0

; Cyberpunk lens-rain overlay (Task 6): cool, speed-reactive streaks on the camera glass (RainFX — a screen
; layer above the post pass, below the HUD). Alpha-blended, so it never washes out the dusk sky or the neon.
; rain=false drops it entirely; rain_strength scales the streak alpha (0 = clear → 1 = full downpour).
rain=true
rain_strength=1.0

; Animated neon "windows" on the buildings (procedural shader). false = flat emissive boxes.
building_windows=true

; Pulsing emissive glow on the hazards (obstacles + traffic) so they telegraph at speed.
hazard_pulse=true

; Fullscreen speed-line streaks that intensify with speed (the "feels fast" layer).
speed_lines=false
speed_lines_strength=0.5

; Chromatic aberration + vignette that ramp with speed / boost (desktop).
chromatic_aberration=true

; White flash + a brief slow-mo on a near-miss (juice). time_dilation 1.0 = no slow-mo,
; lower = stronger dip (e.g. 0.9 briefly slows time to 90%).
near_miss_flash=true
time_dilation=0.9

[audio]

; Master / music / SFX levels, linear 0..1 (0 = silent, 1 = full). Every sound is synthesised
; procedurally in code for now (placeholder tones until real audio assets are added).
master=1.0
music=0.5
sfx=0.3

; Background synth music bed on/off.
music_enabled=false
